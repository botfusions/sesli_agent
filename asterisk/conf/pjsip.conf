; PJSIP ana yapılandırması — ŞABLON.
; entrypoint.sh bu dosyayı envsubst ile işler; yalnızca aşağıdaki değişkenler
; doldurulur: EXTERNAL_IP (diğer ${...} ifadelerine dokunulmaz).

[global]
type = global
user_agent = Botfusions-Asterisk
; Kimliği önce IP'ye (Netgsm), sonra kullanıcı adına (softphone) göre bul.
; "anonymous" YOK: tanınmayan kaynaktan gelen aramalar reddedilir.
endpoint_identifier_order = ip,username

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060
; NAT arkasındaki (Docker/VPS) Asterisk'in SIP ve SDP'de dış IP'yi bildirmesi.
; local_net bilerek tanımlanmadı: tüm SIP karşı tarafları "dış" kabul edilir
; (Asterisk ile voice-agent arasında SIP yok; iç trafik HTTP + AudioSocket).
external_media_address = ${EXTERNAL_IP}
external_signaling_address = ${EXTERNAL_IP}

; Netgsm trunk'ı (NETGSM_SIP_USER verildiyse entrypoint üretir, yoksa boştur)
#tryinclude pjsip_netgsm.conf
; Yerel test softphone'u (SOFTPHONE_PASSWORD verildiyse entrypoint üretir)
#tryinclude pjsip_softphone.conf
