; Asterisk ana ayarları (Botfusions telefon hattı)
; Dizinler Ubuntu paketinin varsayılanlarıdır.
[directories](!)
astetcdir => /etc/asterisk
astmoddir => /usr/lib/x86_64-linux-gnu/asterisk/modules
astvarlibdir => /var/lib/asterisk
astdbdir => /var/lib/asterisk
astkeydir => /var/lib/asterisk
astdatadir => /usr/share/asterisk
astagidir => /usr/share/asterisk/agi-bin
astspooldir => /var/spool/asterisk
astrundir => /var/run/asterisk
astlogdir => /var/log/asterisk
astsbindir => /usr/sbin

[options]
verbose = 3
debug = 0
; FILE()/SHELL() gibi tehlikeli fonksiyonların AMI/AGI gibi dış kaynaklardan
; çağrılmasını engeller. Dialplan'ın kendisi bu ayardan etkilenmez.
live_dangerously = no
; Konteyner zaten asterisk kullanıcısıyla çalışır (Dockerfile: USER asterisk).
maxcalls = 20
documentation_language = en_US
