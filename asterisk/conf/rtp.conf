; RTP ayarları — ŞABLON (değişkenler: RTP_START, RTP_END)
; Bu aralık docker-compose.yml'de ve VPS güvenlik duvarında UDP olarak açık olmalı.
[general]
rtpstart = ${RTP_START}
rtpend = ${RTP_END}
; Sessizlikte bile karşı taraf RTP göndermeye devam eder; 30 sn hiç RTP
; gelmezse çağrı kapatılır (asılı kalan kanalları önler).
rtptimeout = 30
rtpholdtimeout = 300
strictrtp = yes
icesupport = no
