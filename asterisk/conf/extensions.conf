; Dialplan: gelen arama → kayıt (HTTP) → AudioSocket → Python sunucu
; Bu dosya envsubst ile İŞLENMEZ; değerler çalışma anında ${ENV(...)} ile okunur.
; entrypoint.sh şu değişkenleri boşsa varsayılanla doldurur:
;   TELEPHONY_API_URL   (varsayılan http://voice-agent:8090/telephony/asterisk/call)
;   AUDIOSOCKET_TARGET  (varsayılan voice-agent:9092)
;   TELEPHONY_AGENT     (varsayılan botfusions-satis)
;   TELEPHONY_SECRET    (zorunlu)

[general]
static = yes
writeprotect = yes
clearglobalvars = no

[globals]

; --- Netgsm'den gelen aramalar -------------------------------------------
; Netgsm, INVITE'ı kayıtlı kullanıcı adına ya da aranan numaraya (DID)
; gönderebilir; hepsi aynı akışa gider.
[from-netgsm]
exten => s,1,Goto(ai-asistan,s,1)
exten => _X.,1,Goto(ai-asistan,s,1)
exten => _+X.,1,Goto(ai-asistan,s,1)

; --- Yerel test softphone'u (1001) -----------------------------------------
[from-softphone]
exten => 100,1,Set(CALLERID(num)=1001)
 same => n,Goto(ai-asistan,s,1)
; 100 dışındaki her numara reddedilir.
exten => _X.,1,Hangup(1)

; --- Ortak akış -------------------------------------------------------------
[ai-asistan]
exten => s,1,NoOp(Yapay zeka asistani: arayan=${CALLERID(num)} asistan=${ENV(TELEPHONY_AGENT)})
 same => n,Answer()
 ; AudioSocket geçerli bir UUID ister. Çekirdeğin ürettiği rastgele (v4) UUID
 ; kullanılır. FILE() /proc dosyalarını okuyamadığı (boyut 0 görünür) için
 ; sabit komutlu SHELL() kullanılır: komutta arayandan gelen hiçbir veri yok.
 ; live_dangerously=no yalnızca AMI/AGI gibi dış kaynakları kısıtlar; dialplan
 ; içinden SHELL() bu ayarla çalışır. ${UNIQUEID} UUID biçiminde olmadığı ve
 ; tahmin edilebilir olduğu için tercih edilmedi.
 same => n,Set(CALL_UUID=${FILTER(0-9a-f-,${SHELL(cat /proc/sys/kernel/random/uuid)})})
 same => n,GotoIf($[${LEN(${CALL_UUID})} != 36]?hata-uuid)
 ; Kayıt: gizli anahtar loga düşmesin diye ara değişkene yazılmaz; Set satırı
 ; logda yalnızca sonucu (KAYIT=OK) gösterir.
 same => n,Set(CURLOPT(conntimeout)=3)
 same => n,Set(CURLOPT(httptimeout)=5)
 same => n,Set(KAYIT=${CURL(${ENV(TELEPHONY_API_URL)},uuid=${CALL_UUID}&caller=${URIENCODE(${CALLERID(num)})}&agent=${URIENCODE(${ENV(TELEPHONY_AGENT)})}&token=${URIENCODE(${ENV(TELEPHONY_SECRET)})})})
 same => n,GotoIf($["${KAYIT}" = "OK"]?baglan)
 same => n,Log(WARNING,Kayit reddedildi ya da sunucuya ulasilamadi (uuid=${CALL_UUID}, yanit="${KAYIT}"))
 same => n,Hangup(41)
 ; Kayıt 30 sn geçerli; hemen bağlan. Ses 8 kHz slin.
 same => n(baglan),AudioSocket(${CALL_UUID},${ENV(AUDIOSOCKET_TARGET)})
 same => n,Hangup()
 same => n(hata-uuid),Log(ERROR,UUID uretilemedi: "${CALL_UUID}")
 same => n,Hangup(41)

exten => h,1,NoOp(Arama bitti: uuid=${CALL_UUID} sebep=${HANGUPCAUSE})
