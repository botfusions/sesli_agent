; Modül listesi: autoload KAPALI, yalnızca bu kurulumun ihtiyacı olanlar yüklenir.
; (Saldırı yüzeyini ve bellek kullanımını küçük tutar; chan_sip, IAX2, manager,
;  HTTP sunucusu, sesli posta vb. yüklenmez.)
[modules]
autoload = no

; --- Çekirdek altyapı ---
load => res_timing_timerfd.so
load => res_sorcery_config.so
load => res_sorcery_memory.so
load => res_sorcery_memory_cache.so
load => res_sorcery_astdb.so
load => res_rtp_asterisk.so
load => res_curl.so

; --- Kodekler (Netgsm: alaw/ulaw; AudioSocket: 8 kHz slin) ---
load => codec_alaw.so
load => codec_ulaw.so
load => codec_a_mu.so

; --- SIP (PJSIP) ---
load => res_pjproject.so
load => res_pjsip.so
load => chan_pjsip.so
load => res_pjsip_session.so
load => res_pjsip_pubsub.so          ; chan_pjsip bağımlılığı
load => res_pjsip_sdp_rtp.so
load => res_pjsip_authenticator_digest.so
load => res_pjsip_outbound_authenticator_digest.so
load => res_pjsip_outbound_registration.so
load => res_pjsip_endpoint_identifier_ip.so
load => res_pjsip_endpoint_identifier_user.so
load => res_pjsip_registrar.so
load => res_pjsip_nat.so
load => res_pjsip_caller_id.so
load => res_pjsip_dtmf_info.so
load => res_pjsip_rfc3326.so
load => res_pjsip_logger.so

; --- Dialplan ---
load => pbx_config.so
load => func_env.so
load => func_shell.so           ; yalnızca UUID üretimi (sabit komut)
load => func_strings.so
load => func_logic.so
load => func_uri.so
load => func_curl.so
load => func_callerid.so
load => func_channel.so
load => app_verbose.so

; --- AudioSocket (Python sunucuya TCP ses köprüsü) ---
load => res_audiosocket.so
load => app_audiosocket.so
